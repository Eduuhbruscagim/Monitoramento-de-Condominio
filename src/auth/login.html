<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- ⚡ ANTI-FLASH: APLICA TEMA ANTES DO CSS CARREGAR -->
    <script>
      (function() {
        const savedTheme = localStorage.getItem('theme') || 'light';
        const validTheme = (savedTheme === 'dark') ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', validTheme);
      })();
    </script>
    <title>Login - Área do Síndico</title>
    <link rel="icon" type="image/png" href="../imagens/Logo.png">
    <!-- ❌ Performance.js NÃO é módulo ES6 (usa IIFE) -->
    <script src="../performance.js"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../global.css" />
    <link rel="stylesheet" href="login.css" />
  </head>
  <script type="module" src="../dashboard/theme.js"></script>
  <body class="login-page">
    <main class="login-card">
      <div class="login-header">
        <img src="../imagens/Logo.webp" alt="Logo do Sistema" />
        <h2>Bem-vindo de volta</h2>
        <p>Acesse o painel do seu condomínio</p>
      </div>

      <form onsubmit="handleLogin(event)">
        <div class="input-group">
          <label for="email">E-mail</label>
          <div class="input-wrapper">
            <i class="fa-regular fa-envelope"></i>
            <input
              type="email"
              id="email"
              placeholder="seu@email.com"
              required
            />
          </div>
        </div>

        <div class="input-group">
          <label for="password">Senha</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-lock"></i>
            <input
              type="password"
              id="password"
              placeholder="••••••••"
              required
            />
          </div>
        </div>

        <div class="actions">
          <label class="remember-me">
            <input type="checkbox" id="remember-me" /> Lembrar de mim
          </label>
          <a href="forgot-password.html" class="forgot-pass">Esqueceu a senha?</a>
        </div>

        <div id="feedback" class="status-msg"></div>

        <button type="submit" class="btn btn-primary btn-full">
          Entrar na Plataforma
        </button>

        <div class="register-link">
          Não tem uma conta? <a href="register.html">Cadastre-se</a>
        </div>
      </form>

      <a href="../index.html" class="back-link">
        <i class="fa-solid fa-arrow-left"></i> Voltar para o site
      </a>
    </main>

    <script type="module">
      // Importa a instância única configurada
      import { supabase } from '../services/supabase.js';

      // ==========================================
      // 🔧 FUNÇÃO DE VALIDAÇÃO DE EMAIL
      // ==========================================
      function validarEmail(email) {
        const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        return regex.test(email);
      }

      // ==========================================
      // 📝 FUNÇÃO PRINCIPAL DE LOGIN
      // Checkbox "Lembrar-me" com funcionalidade
      // ==========================================
      window.handleLogin = async function(e) {
        e.preventDefault();

        // Elementos da tela
        const btn = e.target.querySelector("button");
        const feedbackBox = document.getElementById("feedback");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const rememberCheckbox = document.getElementById("remember-me");

        const email = emailInput.value.toLowerCase().trim();
        const password = passwordInput.value;
        const originalText = btn.innerText;

        // Limpa mensagens anteriores
        feedbackBox.style.display = "none";
        feedbackBox.className = "status-msg";

        // ==========================================
        // ✅ VALIDAÇÃO DE EMAIL NO FRONTEND
        // ==========================================
        if (!validarEmail(email)) {
          feedbackBox.innerText = "Digite um e-mail válido";
          feedbackBox.classList.add("error");
          feedbackBox.style.display = "block";
          return;
        }

        // Loading state
        btn.innerText = "Autenticando...";
        btn.disabled = true;
        btn.style.opacity = "0.7";

        // ==========================================
        // 🔒 AUTENTICAÇÃO COM SUPABASE
        // ==========================================
        const { data, error } = await supabase.auth.signInWithPassword({
          email: email,
          password: password,
        });

        if (error) {
          // ERRO
          feedbackBox.innerText = "E-mail ou senha incorretos.";
          feedbackBox.classList.add("error");
          feedbackBox.style.display = "block";

          // Reseta o botão
          btn.innerText = originalText;
          btn.disabled = false;
          btn.style.opacity = "1";
        } else {
          // ==========================================
          // ✅ FUNCIONALIDADE "LEMBRAR DE MIM"
          // ==========================================
          if (rememberCheckbox.checked) {
            localStorage.setItem('keepSession', 'true');
          } else {
            localStorage.removeItem('keepSession');
          }

          // SUCESSO - Redireciona
          window.location.href = "../dashboard/dashboard.html";
        }
      }
    </script>
  </body>
</html>
